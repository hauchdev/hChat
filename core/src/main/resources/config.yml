# Do not edit! Used to auto-migrate this file when new options
# are added in future releases (your settings are always kept).
config-version: 7

lang: en
debug: false

update-checker:
  # Check releases for new versions on startup.
  enabled: true
  # Notify players with hchat.update permission on join.
  notify-admins: true

chat:
  default-format: "&7%luckperms_prefix% {player} %luckperms_suffix%&8: &f{message}"

  hex-colors: true

  formats:
    # ─── Permission: hchat.chat.format.vip ───
    vip:
      permission: hchat.chat.format.vip
      format: "&6&lVIP &8» &e{prefix}{player}{suffix} &8: &f{message}"
    # ─── Permission: hchat.chat.format.mvp ───
    mvp:
      permission: hchat.chat.format.mvp
      format: "&b&lMVP &8» &b{prefix}{player}{suffix} &8: &7{message}"
    # ─── Permission: hchat.chat.format.admin ───
    admin:
      permission: hchat.chat.format.admin
      format: "&c&lADMIN &8» &c{prefix}{player}{suffix} &8: &7{message}"

# ─── Dynamic placeholders ─────────────────────────────────────
# Tokens rendered by hChat itself inside chat formats, before PAPI:
#   [ping]   colored latency indicator (green <= good-max, yellow <= medium-max, red above)
#   [item]   item in the main hand, hover shows a NoNChat-style tooltip (name, enchants, durability bar, lore)
#   [coords] player coordinates (x, y, z)
#   [world]  current world name
#   [afk]    "[AFK]" prefix when the player is away (checked via a PAPI placeholder)
#
# Example format: "[ping] [afk]&7{player}&8: &f{message}"
placeholders:
  ping:
    enabled: true
    symbol: "▪"
    # Append the latency value next to the symbol (e.g. "▪ 23ms").
    show-value: true
    value-suffix: "ms"
    # Latency tiers: green <= good-max, yellow <= medium-max, red above.
    good-max: 80
    medium-max: 150
    good-color: "&a"
    medium-color: "&e"
    bad-color: "&c"
    value-color: "&7"
  item:
    enabled: true
  coords:
    enabled: true
    format: "&7({x}, {y}, {z})"
  world:
    enabled: true
    format: "&7{world}"
  afk:
    enabled: true
    # PAPI placeholder that reports the AFK state (EssentialsX, CMI...).
    placeholder: "%essentials_afk%"
    # Values that count as "afk", compared case-insensitively.
    afk-values:
      - "yes"
      - "true"
    format: "&c[AFK]&r "

welcome:
  # Broadcast message on entry. Supports {player}, and PAPI placeholders.
  enabled: true
  message: "&a&lWelcome &e{player} &a&lto the server!"
  # If true, hides the vanilla message "Player joined the game"
  hide-vanilla: true
  # Also show MOTD message to the player (in chat, once)
  motd-on-join: false
  motd: "&7News: &fThe server is on &bv1.20.x&f. Use &a/hchat help&f."

  # Sound in welcome (opcional)
  sound:
    enabled: true
    sound: "entity.player.levelup"
    volume: 0.6
    pitch: 1.0

  # Welcome player (First time)
  first-join:
    enabled: true
    message: "&6&l★ &e{player} &6just joined for the first time!"
    hide-vanilla: true

quit:
  enabled: true
  message: "&c{player} &7left the server."
  hide-vanilla: true
  sound:
    enabled: false

mentions:
  sound:
    enabled: true
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0

  colors:
    enabled: true
    color: "&#54A3FF"

  # Bold highlight on top of the mention color. A real background color
  # is NOT possible in vanilla chat (Adventure Style has no background),
  # so the "highlight" is rendered as bold text.
  highlight: true

  # Mass mentions (@everyone / @here).
  everyone-permission: hchat.mention.everyone
  here-permission: hchat.mention.here
  everyone-cooldown-seconds: 60
  everyone-sound:
    enabled: true
    sound: "entity.wither.spawn"
    volume: 1.0
    pitch: 1.0

direct-messages:

  sender:
    format: "&7[&eYou &7-> &e{receiver}&7] &7{message}"
    hover-text:
      enabled: false
      text:
        - "&7Sent to &e{receiver}"
        - "&eClick to reply"
  receiver:
    format: "&7[&e{sender} &7-> &eYou&7] &7{message}"
    hover-text:
      enabled: true
      text:
        - "&7From &e{sender}"
        - "&eClick to reply"
  clickable-actions:
    enabled: true
    reply-command: "/msg {sender}"

  # Action bar shown to the sender when a DM is not delivered because
  # the receiver has DND enabled or ignores them.
  silenced-action-bar:
    enabled: true
    text: "&e{receiver} is muted - the message was not delivered."

spy-format: "&e{sender} &7-> &e{target}&7: &7{message}"

hover-text:

  enabled: true
  # Supports PlaceholderAPI placeholders.
  format:
    - "&#54FF7F %player_name%" # Name of player
    - "&7"
    - "&eClick to send a private message"

# ─── Chat channels ────────────────────────────────────────────────
# Each channel has its own format, range (-1 = no limit), optional
# speak/see permissions, optional cooldown and optional chat alias.
#
# Available format placeholders: {prefix} {suffix} {player} {message}
#
# In-game:
#   /channel            - list channels
#   /channel <name>     - switch your active channel
#   #staff <message>    - send to a channel from anywhere via alias
#
# A player's active channel is remembered between sessions.
channels:
  # Join a channel automatically based on permission (first match wins).
  # This never overrides a channel the player chose themselves.
  default-by-permission:
    - permission: hchat.channel.default.vip
      channel: vip

  # Show the active channel in the action bar after switching / on join.
  hint-on-switch: true
  hint-on-join: true

  global:
    # -1 = no limit (whole server). Default channel everyone starts in.
    # Its format comes from chat.default-format / chat.formats
    # (permission-based vip/mvp/admin), so leave `format` empty here.
    range: -1

  local:
    # Distance-based local chat: only players within `range` blocks
    # see it. Players just outside the range get the action-bar hint.
    format: "&8[Local] &7{player} &8» &f{message}"
    range: 80
    action-bar-hint: "&eThere are people talking near you"
    alias: "#l"

  staff:
    # Only players with the speak permission can send; only players
    # with the see permission receive it.
    format: "&c[Staff] {player} &8» &f{message}"
    speak-permission: hchat.channel.staff
    see-permission: hchat.channel.staff.see
    alias: "#staff"

  vip:
    format: "&e[VIP] {player} &8» &f{message}"
    speak-permission: hchat.chat.format.vip
    alias: "#vip"

  trade:
    # Anti-spam: one message every 5 seconds per player in this channel.
    format: "&6[Trade] {player} &8» &f{message}"
    cooldown-ms: 5000
    alias: "#trade"

  world:
    # World-scoped channel: messages never cross worlds. {world} is
    # replaced with the sender's world name.
    format: "&7[{world}] {player} &8» &f{message}"
    range: -1
    per-world: true
    alias: "#world"

broadcast:
  enabled: true
  # Anti-spam for /broadcast (0 = disabled). Shared with channel cooldowns.
  cooldown-ms: 0
  format:
    - ""
    - "&#2791F5Broadcast:"
    - "{message}"

  example1:
    enabled: true
    message: "&#F52727This broadcast sent every 10 minutes. Edit in /hChat/config.yml"
    interval: 600
    display-in-console: true

offline-messages:
  max-pending: 10
  sound:
    enabled: true
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0

logging:
  private-messages:
    enabled: true
    path: logs
    retention-days: 30

word-filter:
  enabled: true
  words:
    - "blacklist1"
    - "blacklist2"
  action: "block"   # block | mask | warn

# ─── Advanced filters ────────────────────────────────────────────
# Run in order: word-filter, anti-unicode, anti-caps, anti-ad, anti-spam.
# Common actions: block | mask | warn | lowercase
filters:
  anti-caps:
    enabled: true
    max-uppercase-percent: 70
    min-length: 8
    action: "mask"
  anti-unicode:
    enabled: true
    # Zero-width spaces, direction overrides, BOM, tag characters...
    block-invisible: true
    action: "block"
  anti-ad:
    enabled: true
    # An empty list disables the filter (defaults apply only when the key
    # is missing). "me" is intentionally not a default TLD: "help.me"
    # would false-positive on normal prose.
    patterns:
      - "(?<![a-zA-Z0-9])([a-z0-9-]+\\.)+(com|net|org|gg|io)"
      - "(discord\\.gg/|discordapp\\.com/invite/)"
    # low | medium | high (reserved for future tuning)
    sensitivity: medium
    # Substring match: a whitelisted address passes even inside longer text.
    whitelist:
      - "tu-servidor.com"
      - "discord.gg/tuinvite"
    action: "warn"
  anti-spam:
    enabled: true
    # One message per player every N ms, plus flood detection.
    global-cooldown-ms: 1500
    flood:
      max-messages: 5
      window-seconds: 3
      similarity-threshold: 0.8
    action: "block"

# ─── Chat replay ─────────────────────────────────────────────────
# In-memory ring buffer used by /hchat replay [player].
replay:
  capacity: 50

# ─── AFK ──────────────────────────────────────────────────────────
# Built-in AFK state: /afk command + automatic detection after N
# minutes of inactivity. Drives the [afk] chat token.
afk:
  enabled: true
  # Seconds of inactivity before a player is marked AFK automatically (0 = off).
  auto-timeout-seconds: 300
  # How often the inactivity check runs (seconds).
  check-interval-seconds: 30
  # Any activity (movement, chat, commands, interactions) removes the AFK state.
  unset-on-activity: true
  # Announce in chat when an AFK player starts talking again.
  notify-unset: true

# ─── Slowmode ─────────────────────────────────────────────────────
# Global chat slowmode: one message per player every N seconds.
slowmode:
  enabled: true
  seconds: 3
  bypass-permission: hchat.slowmode.bypass

# ─── Chat lock ────────────────────────────────────────────────────
# Blocks the whole chat. Staff holding the bypass can keep talking.
chat-lock:
  enabled: true
  bypass-permission: hchat.chatlock.bypass

# ─── Staff chat (/sc) ─────────────────────────────────────────────
staff-chat:
  format: "&c[Staff] {player} &8» &f{message}"
  log-to-console: true

# ─── Death messages ───────────────────────────────────────────────
# Replaces the vanilla death message. Empty format = hide them.
# Note: this replaces ALL death messages, including PvP kills (the
# killer is not shown in the basic format).
death-message:
  enabled: true
  format: "&c☠ &7{player} &fdied by {cause}"
  custom:
    FALL: "&c{player} learned to fly."
    LAVA: "&c{player} made friends with the magma."