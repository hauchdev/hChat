name: Build
on:
  push:
    branches: [ dev ]
    tags:
      - 'v*'
  pull_request:
    branches: [ dev ]

jobs:
  build:
    name: Build and Verify Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verificar dependencias y compilar

        run: mvn clean verify --batch-mode --errors --fail-at-end

      - name: Archivar artefacto de producción (Temporal)
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Plugin-Production
          path: target/*.jar
          retention-days: 7

  release:
    name: Publish Production Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: Minecraft-Plugin-Production
          path: ./release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
