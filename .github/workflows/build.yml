name: Build

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Pinned to a specific LTS patch: avoids dynamic Adoptium API
          # resolution that intermittently fails on ubuntu-latest runners.
          java-version: '21.0.5'
          cache: 'maven'

      - name: Compile all modules, run unit tests and produce shaded jar
        run: mvn clean package --batch-mode --errors --fail-at-end

      - name: Upload shaded jar
        uses: actions/upload-artifact@v4
        with:
          name: hChat
          path: plugin-dist/target/hChat-*.jar
          retention-days: 90

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: hChat
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
