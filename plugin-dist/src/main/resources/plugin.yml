name: hChat
version: '${version}'

main: dev.hauch.hchat.HChat
api-version: '1.18'
load: STARTUP

authors: [ Hauchdev ]
website: https://github.com/hauchdev/hChat

depend:
  - PlaceholderAPI
  - LuckPerms

softdepend:
  - Vault
  - DiscordSRV

permissions:
  hchat.*:
    description: Give access to all hchat commands
    default: op
    children:
      - hchat.message
      - hchat.reply
      - hchat.broadcast
      - hchat.reload
      - hchat.update
      - hchat.help
      - hchat.clear
      - hchat.ignore
      - hchat.sc
      - hchat.spy
      - hchat.spy.all
      - hchat.broadcast.color
      - hchat.lang
      - hchat.monitor.filter
      - hchat.bypass-log
      - hchat.channel
      - hchat.slowmode
      - hchat.slowmode.bypass
      - hchat.chatlock
      - hchat.chatlock.bypass
      - hchat.dnd
      - hchat.sc
      - hchat.ping
      - hchat.ping.others
      - hchat.seen
      - hchat.mention.everyone
      - hchat.mention.here
      - hchat.bypass.dnd
      - hchat.afk

  hchat.message:
    description: Allows /message command
    default: true
  hchat.reply:
    description: Allows /reply command
    default: true
  hchat.reload:
    description: Allows /hchat reload command
    default: op
  hchat.update:
    description: Allows /hchat update command and update notifications
    default: op
  hchat.help:
    description: Allows /hchat help command
    default: true
  hchat.clear:
    description: Allows /clear command
    default: op
  hchat.ignore:
    description: Allows /ignore command
    default: true
  hchat.spy:
    description: Allows /spy command
    default: op
  hchat.spy.all:
    description: Receive all messages from all channels regardless of settings
    default: op
  hchat.broadcast:
    default: op
  hchat.broadcast.color:
    default: op
  hchat.lang:
    default: true
  hchat.monitor.filter:
    default: op
  hchat.bypass-log:
    default: op
  hchat.channel:
    description: Allows /channel command
    default: true
  hchat.slowmode:
    description: Allows /slowmode command
    default: op
  hchat.slowmode.bypass:
    description: Bypass the global chat slowmode
    default: op
  hchat.chatlock:
    description: Allows /chatlock command
    default: op
  hchat.chatlock.bypass:
    description: Keep talking while the chat is locked
    default: op
  hchat.dnd:
    description: Allows /dnd command
    default: true
  hchat.sc:
    description: Allows /sc staff chat
    default: op
  hchat.ping:
    description: Allows /ping command
    default: true
  hchat.ping.others:
    description: Allows checking other players' ping
    default: op
  hchat.seen:
    description: Allows /seen command
    default: true
  hchat.mention.everyone:
    description: Allows using @everyone
    default: op
  hchat.mention.here:
    description: Allows using @here
    default: op
  hchat.bypass.dnd:
    description: Send messages to players with DND enabled
    default: op
  hchat.afk:
    description: Allows /afk command
    default: true

commands:
  message:
    description: Send a message to a player.
    aliases: [msg, tell, w, m, whisper]
    usage: /message <player> <message>
    permission: hchat.message
    permission-message: You do not have <permission> to use this command!
  reply:
    description: Reply to a player.
    aliases: [r]
    usage: /reply <message>
    permission: hchat.reply
    permission-message: You do not have <permission> to use this command!
  hchat:
    description: Main plugin command for hchat.
    usage: /hchat <reload|help>
    permission: hchat.help
    permission-message: You do not have <permission> to use this command!
  clear:
    description: Clear chat.
    usage: /clear
    permission: hchat.clear
    permission-message: You do not have <permission> to use this command!
  ignore:
    description: Ignore a player.
    usage: /ignore <player>
    permission: hchat.ignore
    permission-message: You do not have <permission> to use this command!
  spy:
    description: Spy on a player.
    usage: /spy
    permission: hchat.spy
    permission-message: You do not have <permission> to use this command!
  broadcast:
    description: Broadcast a message.
    usage: /broadcast
    aliases:
      - bc
    permission: hchat.broadcast
    permission-message: You do not have <permission> to use this command!
  channel:
    description: Switch chat channels.
    usage: /channel [name]
    aliases:
      - ch
    permission: hchat.channel
    permission-message: You do not have <permission> to use this command!
  slowmode:
    description: Set the global chat slowmode.
    usage: /slowmode <seconds|off|status>
    permission: hchat.slowmode
    permission-message: You do not have <permission> to use this command!
  chatlock:
    description: Lock or unlock the chat.
    usage: /chatlock <on|off|status>
    permission: hchat.chatlock
    permission-message: You do not have <permission> to use this command!
  dnd:
    description: Toggle do-not-disturb mode.
    usage: /dnd [on|off]
    permission: hchat.dnd
    permission-message: You do not have <permission> to use this command!
  sc:
    description: Staff chat.
    usage: /sc <message>
    permission: hchat.sc
    permission-message: You do not have <permission> to use this command!
  ping:
    description: Show your (or another player's) ping.
    usage: /ping [player]
    permission: hchat.ping
    permission-message: You do not have <permission> to use this command!
  seen:
    description: Show when a player was last seen.
    usage: /seen <player>
    permission: hchat.seen
    permission-message: You do not have <permission> to use this command!
  afk:
    description: Toggle AFK state (optionally with a message).
    usage: /afk [message]
    permission: hchat.afk
    permission-message: You do not have <permission> to use this command!